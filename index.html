<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石巻 タイドグラフ EQ風</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1628;
      color: #e0eaf5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .header-left { display: flex; flex-direction: column; }
    .location { font-size: 22px; font-weight: 700; color: #fff; }
    .date { font-size: 13px; color: #7a92b5; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .reload-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(60, 100, 160, 0.35);
      border: 1px solid rgba(100, 140, 200, 0.4);
      color: #a8c4e8; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .reload-btn:hover { background: rgba(60, 100, 160, 0.55); color: #fff; }
    .reload-btn.spinning { animation: spin 0.8s linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .graph-card {
      background: rgba(15, 30, 55, 0.75);
      border-radius: 16px;
      padding: 14px 10px 16px;
      border: 1px solid rgba(60, 90, 140, 0.3);
    }
    .graph-title {
      font-size: 14px; color: #a8c4e8; margin-bottom: 10px;
      padding-left: 6px; display: flex; align-items: center; gap: 6px;
    }
    .eq-container {
      width: 100%;
      height: 280px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 8px 30px;
      position: relative;
      background: linear-gradient(to top, rgba(20,40,70,0.4) 0%, transparent 100%);
      border-radius: 8px;
    }
    .eq-bar {
      flex: 1;
      margin: 0 1.5px;
      border-radius: 4px 4px 2px 2px;
      background: linear-gradient(to top, #1e40af, #3b82f6, #60a5fa);
      transition: height 0.4s ease;
      position: relative;
      min-width: 6px;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
    }
    .eq-bar.current {
      background: linear-gradient(to top, #b91c1c, #ef4444, #f87171);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }
    .eq-bar.high {
      background: linear-gradient(to top, #1e3a8a, #2563eb, #93c5fd);
    }
    .marker {
      position: absolute;
      font-size: 11px;
      color: #c5d8f0;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
    .marker .time {
      font-weight: 700;
      color: #fff;
      font-size: 12px;
    }
    .marker.high { color: #93c5fd; }
    .marker.low { color: #94a3b8; }

    .bottom-bar {
      background: rgba(15, 30, 55, 0.85);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(60, 90, 140, 0.25);
    }
    .info-item { display: flex; align-items: center; gap: 8px; }
    .info-label { font-size: 11px; color: #7a92b5; }
    .info-value { font-size: 17px; font-weight: 700; color: #e8f0fa; }
    .divider { width: 1px; height: 30px; background: rgba(100, 130, 180, 0.3); }
    .note { font-size: 11px; color: #5a7399; text-align: center; padding: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="location">石巻</div>
        <div class="date" id="date-label">読み込み中...</div>
      </div>
      <div class="header-right">
        <div class="date" id="now-time">--:--</div>
        <button class="reload-btn" id="reload-btn" title="最新情報に更新">↻</button>
      </div>
    </div>

    <div class="graph-card">
      <div class="graph-title">🎚 タイドグラフ EQ風（石巻）</div>
      <div class="eq-container" id="eq-container">
        <!-- バーはJSで生成 -->
      </div>
    </div>

    <div class="bottom-bar">
      <div class="info-item">
        <div style="font-size:18px">🌡️</div>
        <div>
          <div class="info-label">気温</div>
          <div class="info-value" id="temp-value">--°C</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div style="font-size:18px">↗️</div>
        <div>
          <div class="info-label">風向・風速</div>
          <div class="info-value" id="wind-value">--</div>
        </div>
      </div>
    </div>

    <div class="note">
      潮位をグラフィックイコライザー風に表示　天気：Open-Meteo実況<br>
      赤いバーが現在時刻　↻で最新情報を再取得
    </div>
  </div>

  <script>
    // 今日の潮位予測ポイント（石巻 2026/10/20）
    // 時間(h) : 潮位(cm)
    const tidePoints = [
      { h: 0,   cm: 80 },
      { h: 4.5, cm: 54 },   // 干潮 04:31
      { h: 8,   cm: 80 },
      { h: 13.27, cm: 119 }, // 満潮 13:16
      { h: 16,  cm: 110 },
      { h: 18.32, cm: 106 }, // 干潮 18:19
      { h: 20,  cm: 108 },
      { h: 21.45, cm: 109 }, // 満潮 21:27
      { h: 24,  cm: 95 }
    ];

    // 任意の時間の潮位を線形補間
    function getTideAt(hour) {
      for (let i = 0; i < tidePoints.length - 1; i++) {
        const a = tidePoints[i];
        const b = tidePoints[i + 1];
        if (hour >= a.h && hour <= b.h) {
          const t = (hour - a.h) / (b.h - a.h);
          return a.cm + (b.cm - a.cm) * t;
        }
      }
      return 80;
    }

    function createEQ() {
      const container = document.getElementById('eq-container');
      container.innerHTML = '';

      const barCount = 36; // バーの本数（多いほど滑らか）
      const maxHeight = 220; // px
      const maxCm = 150;

      const now = new Date();
      const currentH = now.getHours() + now.getMinutes() / 60;

      for (let i = 0; i < barCount; i++) {
        const hour = (i / (barCount - 1)) * 24;
        const cm = getTideAt(hour);
        const height = Math.max(8, (cm / maxCm) * maxHeight);

        const bar = document.createElement('div');
        bar.className = 'eq-bar';
        bar.style.height = height + 'px';

        // 現在時刻に近いバーを赤く
        if (Math.abs(hour - currentH) < (24 / barCount)) {
          bar.classList.add('current');
        }
        // 満潮付近を少し明るく
        if (Math.abs(hour - 13.27) < 0.8 || Math.abs(hour - 21.45) < 0.8) {
          bar.classList.add('high');
        }

        container.appendChild(bar);
      }

      // マーカー追加
      addMarker(container, 4.52, '干潮', '04:31', 'low');
      addMarker(container, 13.27, '満潮', '13:16', 'high');
      addMarker(container, 18.32, '干潮', '18:19', 'low');
      addMarker(container, 21.45, '満潮', '21:27', 'high');
    }

    function addMarker(container, hour, label, time, type) {
      const left = (hour / 24) * 100;
      const div = document.createElement('div');
      div.className = `marker ${type}`;
      div.style.left = `calc(${left}% - 20px)`;
      div.style.bottom = '2px';
      div.innerHTML = `<div>${label}</div><div class="time">${time}</div>`;
      container.appendChild(div);
    }

    function updateTimeDisplay() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('now-time').textContent = h + ':' + m;
    }

    function updateDate() {
      const now = new Date();
      const week = ['日','月','火','水','木','金','土'];
      document.getElementById('date-label').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${week[now.getDay()]}）・長潮`;
    }

    function degToDir(deg) {
      const dirs = ["北","北北東","北東","東北東","東","東南東","南東","南南東",
                    "南","南南西","南西","西南西","西","西北西","北西","北北西"];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    async function fetchWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=38.43&longitude=141.30&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=Asia%2FTokyo&wind_speed_unit=ms';
        const res = await fetch(url);
        const data = await res.json();
        const cur = data.current;
        document.getElementById('temp-value').textContent = (Math.round(cur.temperature_2m*10)/10) + '°C';
        document.getElementById('wind-value').textContent =
          `${degToDir(cur.wind_direction_10m)} ${Math.round(cur.wind_speed_10m*10)/10} m/s`;
      } catch (e) {
        document.getElementById('temp-value').textContent = '--°C';
        document.getElementById('wind-value').textContent = '取得失敗';
      }
    }

    async function reloadData() {
      const btn = document.getElementById('reload-btn');
      btn.classList.add('spinning');
      updateDate();
      updateTimeDisplay();
      createEQ();
      await fetchWeather();
      setTimeout(() => btn.classList.remove('spinning'), 800);
    }

    // 初期化
    updateDate();
    updateTimeDisplay();
    createEQ();
    fetchWeather();

    document.getElementById('reload-btn').addEventListener('click', reloadData);
    setInterval(() => {
      updateTimeDisplay();
      createEQ(); // 現在位置のバーを更新
    }, 60000);
  </script>
</body>
</html>
