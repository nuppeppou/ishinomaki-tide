<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石巻 タイドグラフ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1628;
      color: #e0eaf5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 4px;
    }
    .location {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .date {
      font-size: 13px;
      color: #7a92b5;
    }
    .graph-card {
      background: rgba(15, 30, 55, 0.75);
      border-radius: 16px;
      padding: 14px 10px 12px;
      border: 1px solid rgba(60, 90, 140, 0.3);
    }
    .graph-title {
      font-size: 14px;
      color: #a8c4e8;
      margin-bottom: 6px;
      padding-left: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .graph-container {
      width: 100%;
      height: 320px;
    }
    svg { width: 100%; height: 100%; display: block; }
    .bottom-bar {
      background: rgba(15, 30, 55, 0.85);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(60, 90, 140, 0.25);
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-label { font-size: 11px; color: #7a92b5; }
    .info-value { font-size: 17px; font-weight: 700; color: #e8f0fa; }
    .divider {
      width: 1px;
      height: 30px;
      background: rgba(100, 130, 180, 0.3);
    }
    .note {
      font-size: 11px;
      color: #5a7399;
      text-align: center;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <div class="header">
      <div>
        <div class="location">石巻</div>
        <div class="date">2026年10月20日（火）・長潮</div>
      </div>
      <div class="date" id="now-time"></div>
    </div>

    <!-- タイドグラフ -->
    <div class="graph-card">
      <div class="graph-title">🌊 タイドグラフ（石巻）</div>
      <div class="graph-container">
        <svg viewBox="0 0 400 310" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.1"/>
            </linearGradient>
            <linearGradient id="mazume" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c9a227" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#c9a227" stop-opacity="0.05"/>
            </linearGradient>
          </defs>

          <!-- マズメ帯（簡易） -->
          <rect x="55" y="30" width="50" height="240" fill="url(#mazume)"/>
          <rect x="285" y="30" width="50" height="240" fill="url(#mazume)"/>

          <!-- グリッド -->
          <g stroke="#2a4060" stroke-width="1" stroke-dasharray="3,4">
            <line x1="40" y1="50" x2="380" y2="50"/>
            <line x1="40" y1="100" x2="380" y2="100"/>
            <line x1="40" y1="150" x2="380" y2="150"/>
            <line x1="40" y1="200" x2="380" y2="200"/>
            <line x1="40" y1="250" x2="380" y2="250"/>
          </g>

          <!-- Y軸ラベル -->
          <g fill="#6b85a8" font-size="11" text-anchor="end">
            <text x="36" y="54">150</text>
            <text x="36" y="104">120</text>
            <text x="36" y="154">90</text>
            <text x="36" y="204">60</text>
            <text x="36" y="254">30</text>
            <text x="36" y="294">0</text>
          </g>
          <text x="18" y="28" fill="#6b85a8" font-size="11">cm</text>

          <!-- 
            スケール: x=40(0時) ～ x=380(24時)  → 1時間 = 14.1667px
            干潮 04:31 → x=104
            満潮 13:16 → x=228
            干潮 18:19 → x=300
            満潮 21:27 → x=344
            現在 ≈13:57 → x=238
            Y: 0cm=y290 / 150cm=y50
          -->

          <!-- 潮位曲線 -->
          <path d="M 40 240
                   C 70 238, 90 235, 104 234
                   S 140 190, 170 145
                   S 200 110, 228 100
                   S 255 110, 280 125
                   S 300 132, 300 132
                   S 320 128, 344 126
                   S 365 124, 380 122"
                fill="url(#waveFill)"
                stroke="#60a5fa"
                stroke-width="2.5"
                stroke-linecap="round"/>

          <!-- 現在時刻ライン -->
          <line x1="238" y1="30" x2="238" y2="280"
                stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
          <rect x="208" y="105" width="60" height="20" rx="4" fill="#ef4444"/>
          <text x="238" y="119" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">現在</text>
          <polygon points="238,127 233,135 243,135" fill="#ef4444"/>

          <!-- 干潮 04:31 (54cm) -->
          <polygon points="104,241 99,231 109,231" fill="#94a3b8"/>
          <text x="104" y="258" text-anchor="middle" fill="#c5d8f0" font-size="11">干潮</text>
          <text x="104" y="272" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">04:31</text>

          <!-- 満潮 13:16 (119cm) -->
          <polygon points="228,93 223,103 233,103" fill="#60a5fa"/>
          <text x="228" y="83" text-anchor="middle" fill="#c5d8f0" font-size="11">満潮</text>
          <text x="228" y="71" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">13:16</text>

          <!-- 干潮 18:19 (106cm) -->
          <polygon points="300,139 295,129 305,129" fill="#94a3b8"/>
          <text x="300" y="156" text-anchor="middle" fill="#c5d8f0" font-size="11">干潮</text>
          <text x="300" y="170" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">18:19</text>

          <!-- 満潮 21:27 (109cm) -->
          <polygon points="344,119 339,129 349,129" fill="#60a5fa"/>
          <text x="344" y="109" text-anchor="middle" fill="#c5d8f0" font-size="11">満潮</text>
          <text x="344" y="97" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">21:27</text>
        </svg>
      </div>
    </div>

    <!-- 下部：気温・風 -->
    <div class="bottom-bar">
      <div class="info-item">
        <div style="font-size:18px">🌡️</div>
        <div>
          <div class="info-label">気温</div>
          <div class="info-value">18°C</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div style="font-size:18px">↗️</div>
        <div>
          <div class="info-label">風向・風速</div>
          <div class="info-value">北北東 2 m/s</div>
        </div>
      </div>
    </div>

    <div class="note">
      潮位：気象庁予測（石巻）　気温・風：アメダス石巻付近の実況目安<br>
      ※実測潮位は気象条件により異なる場合があります
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('now-time').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 30000);
  </script>
</body>
</html>
