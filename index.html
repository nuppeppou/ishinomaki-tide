<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a192f">
  <title>石巻市 潮位・天気リアルタイム</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(160deg, #0a192f 0%, #112240 100%);
      color: #e6f1ff;
      line-height: 1.5;
      overscroll-behavior: none;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .container { max-width: 640px; margin: 0 auto; padding: 0 16px; }
    header { text-align: center; padding: 12px 0 16px; }
    h1 { font-size: 1.45rem; font-weight: 700; }
    .subtitle { font-size: 0.88rem; color: #8892b0; margin-top: 4px; }
    .card {
      background: rgba(17, 34, 64, 0.85);
      border: 1px solid #233554;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .realtime-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; background: #64ffda; color: #0a192f;
      font-weight: 700; font-size: 1.1rem; text-align: center;
      padding: 16px; border-radius: 14px; text-decoration: none;
      margin-bottom: 12px; min-height: 54px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .realtime-btn:active { transform: scale(0.97); opacity: 0.9; }
    .note { font-size: 0.8rem; color: #8892b0; text-align: center; line-height: 1.5; }

    /* 天気カード */
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .weather-item {
      background: #112240;
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
    }
    .weather-item .label {
      font-size: 0.75rem;
      color: #8892b0;
      margin-bottom: 4px;
    }
    .weather-item .value {
      font-size: 1.35rem;
      font-weight: 700;
      color: #64ffda;
    }
    .weather-item .unit {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .chart-wrapper { position: relative; height: 260px; width: 100%; }
    @media (min-height: 700px) { .chart-wrapper { height: 300px; } }
    @media (orientation: landscape) and (max-height: 500px) { .chart-wrapper { height: 200px; } }

    .info {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
    }
    .info-item {
      background: #112240; padding: 12px 8px; border-radius: 12px; text-align: center;
    }
    .info-item span { display: block; font-size: 0.75rem; color: #8892b0; margin-bottom: 2px; }
    .info-item strong { font-size: 1.2rem; color: #64ffda; font-weight: 600; }

    footer {
      text-align: center; margin-top: 20px; font-size: 0.72rem;
      color: #64748b; line-height: 1.5; padding-bottom: 10px;
    }

    @media (max-width: 380px) {
      .weather-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>石巻市 潮位・天気</h1>
      <p class="subtitle">石巻港リアルタイム情報</p>
    </header>

    <!-- リアルタイム潮位リンク -->
    <div class="card">
      <a class="realtime-btn" href="https://nowphas.mlit.go.jp/sp/pg_choui/218/" target="_blank" rel="noopener">
        ▶ 潮位リアルタイム実測を見る
      </a>
      <p class="note">国土交通省ナウファス公式（1分更新）</p>
    </div>

    <!-- 天気情報 -->
    <div class="card">
      <h2 style="font-size:1.05rem; margin-bottom:12px; text-align:center;">現在の天気（石巻）</h2>
      <div class="weather-grid" id="weatherInfo">
        <div class="weather-item">
          <div class="label">気温</div>
          <div class="value" id="temp">--<span class="unit">℃</span></div>
        </div>
        <div class="weather-item">
          <div class="label">風速</div>
          <div class="value" id="windSpeed">--<span class="unit">m/s</span></div>
        </div>
        <div class="weather-item">
          <div class="label">風向</div>
          <div class="value" id="windDir" style="font-size:1.15rem;">--</div>
        </div>
      </div>
      <p class="note" style="margin-top:12px;" id="weatherUpdate">データ取得中...</p>
    </div>

    <!-- 潮位グラフ -->
    <div class="card">
      <h2 style="font-size:1.05rem; margin-bottom:12px; text-align:center;">本日の予測潮位（参考）</h2>
      <div class="chart-wrapper">
        <canvas id="tideChart"></canvas>
      </div>
      <div class="info">
        <div class="info-item">
          <span>現在時刻（JST）</span>
          <strong id="nowTime">--:--</strong>
        </div>
        <div class="info-item">
          <span>最終更新</span>
          <strong id="updateTime">--</strong>
        </div>
      </div>
      <p class="note" style="margin-top:12px;">
        ※潮位グラフは予測値です。正確な実測は上の公式ページを確認してください。
      </p>
    </div>

    <footer>
      天気データ：Open-Meteo / 潮位：国土交通省ナウファス・気象庁<br>
      このページは参考用です。
    </footer>
  </div>

  <script>
    // ========== 天気取得 ==========
    async function fetchWeather() {
      try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=38.42&longitude=141.30&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=Asia%2FTokyo&wind_speed_unit=ms";
        const res = await fetch(url);
        const data = await res.json();
        const current = data.current;

        document.getElementById("temp").innerHTML = `${current.temperature_2m.toFixed(1)}<span class="unit">℃</span>`;
        document.getElementById("windSpeed").innerHTML = `${current.wind_speed_10m.toFixed(1)}<span class="unit">m/s</span>`;
        document.getElementById("windDir").textContent = degToDirection(current.wind_direction_10m);

        const now = new Date();
        document.getElementById("weatherUpdate").textContent =
          `更新：${now.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}（Open-Meteo）`;
      } catch (e) {
        document.getElementById("weatherUpdate").textContent = "天気データの取得に失敗しました";
      }
    }

    // 風向を日本語に変換
    function degToDirection(deg) {
      const directions = ["北", "北北東", "北東", "東北東", "東", "東南東", "南東", "南南東",
                          "南", "南南西", "南西", "西南西", "西", "西北西", "北西", "北北西"];
      const index = Math.round(deg / 22.5) % 16;
      return directions[index];
    }

    // ========== 潮位グラフ ==========
    function generateTideData() {
      const labels = [], data = [];
      const base = 80, amp1 = 48, amp2 = 14;
      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 30) {
          const hour = h + m / 60;
          labels.push(`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`);
          const tide = base + amp1 * Math.sin(2 * Math.PI * (hour - 3.2) / 12.42)
                           + amp2 * Math.sin(4 * Math.PI * (hour - 1.5) / 12.42);
          data.push(Math.round(tide));
        }
      }
      return { labels, data };
    }

    const { labels, data } = generateTideData();
    new Chart(document.getElementById("tideChart").getContext("2d"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "予測潮位 (cm)",
          data,
          borderColor: "#64ffda",
          backgroundColor: "rgba(100, 255, 218, 0.12)",
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8892b0", maxTicksLimit: 8, font: { size: 11 } }, grid: { color: "rgba(136,146,176,0.08)" } },
          y: { ticks: { color: "#8892b0", font: { size: 11 } }, grid: { color: "rgba(136,146,176,0.08)" },
               title: { display: true, text: "潮位 (cm)", color: "#8892b0", font: { size: 12 } } }
        }
      }
    });

    // 時計
    function updateClock() {
      const now = new Date();
      document.getElementById("nowTime").textContent = now.toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", second: "2-digit" });
      document.getElementById("updateTime").textContent = now.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    // 初期化
    fetchWeather();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 10 * 60 * 1000); // 10分ごとに天気更新
  </script>
</body>
</html>
