<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石巻 タイドグラフ（ライブ）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1628;
      color: #e0eaf5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .header-left { display: flex; flex-direction: column; }
    .location { font-size: 22px; font-weight: 700; color: #fff; }
    .date { font-size: 13px; color: #7a92b5; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .reload-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(60, 100, 160, 0.35);
      border: 1px solid rgba(100, 140, 200, 0.4);
      color: #a8c4e8; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .reload-btn:hover { background: rgba(60, 100, 160, 0.55); color: #fff; }
    .reload-btn.spinning { animation: spin 0.8s linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .graph-card {
      background: rgba(15, 30, 55, 0.75);
      border-radius: 16px;
      padding: 14px 10px 16px;
      border: 1px solid rgba(60, 90, 140, 0.3);
    }
    .graph-title {
      font-size: 14px; color: #a8c4e8; margin-bottom: 10px;
      padding-left: 6px; display: flex; align-items: center; gap: 6px;
    }
    .eq-container {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 6px 16px;
      position: relative;
      background: linear-gradient(to top, rgba(20,40,70,0.4) 0%, transparent 100%);
      border-radius: 8px;
    }
    .eq-bar {
      flex: 1;
      margin: 0 1px;
      border-radius: 3px 3px 1px 1px;
      background: linear-gradient(to top, #1e40af, #3b82f6, #60a5fa);
      transition: height 0.5s ease;
      min-width: 5px;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.25);
    }
    .eq-bar.current {
      background: linear-gradient(to top, #b91c1c, #ef4444, #fca5a5);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.55);
    }
    .status {
      font-size: 12px;
      color: #7a92b5;
      text-align: center;
      margin-top: 6px;
    }
    .bottom-bar {
      background: rgba(15, 30, 55, 0.85);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(60, 90, 140, 0.25);
      gap: 4px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }
    .info-label { font-size: 11px; color: #7a92b5; }
    .info-value { font-size: 15px; font-weight: 700; color: #e8f0fa; white-space: nowrap; }
    .divider { width: 1px; height: 28px; background: rgba(100, 130, 180, 0.3); flex-shrink: 0; }
    .note { font-size: 11px; color: #5a7399; text-align: center; padding: 4px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="location">石巻</div>
        <div class="date" id="date-label">読み込み中...</div>
      </div>
      <div class="header-right">
        <div class="date" id="now-time">--:--</div>
        <button class="reload-btn" id="reload-btn" title="最新情報に更新">↻</button>
      </div>
    </div>

    <div class="graph-card">
      <div class="graph-title">🎚 タイドグラフ（ライブ近似）</div>
      <div class="eq-container" id="eq-container"></div>
      <div class="status" id="status">データ取得中...</div>
    </div>

    <div class="bottom-bar">
      <div class="info-item">
        <div style="font-size:16px">🌡️</div>
        <div>
          <div class="info-label">気温</div>
          <div class="info-value" id="temp-value">--°C</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div style="font-size:16px">🌊</div>
        <div>
          <div class="info-label">海水温</div>
          <div class="info-value" id="sst-value">--°C</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div style="font-size:16px">↗️</div>
        <div>
          <div class="info-label">風</div>
          <div class="info-value" id="wind-value">--</div>
        </div>
      </div>
    </div>

    <div class="note">
      潮位・海水温：Open-Meteo Marine（近似値）<br>
      気温・風：Open-Meteo 実況　↻で最新データを再取得<br>
      ※正確な満潮・干潮は気象庁潮位表を、海水温は現地観測を優先してください
    </div>
  </div>

  <script>
    const LAT = 38.43;
    const LON = 141.30;

    function degToDir(deg) {
      const dirs = ["北","北北東","北東","東北東","東","東南東","南東","南南東",
                    "南","南南西","南西","西南西","西","西北西","北西","北北西"];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    function updateDateTime() {
      const now = new Date();
      const week = ['日','月','火','水','木','金','土'];
      document.getElementById('date-label').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${week[now.getDay()]}）`;
      document.getElementById('now-time').textContent =
        String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }

    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=Asia%2FTokyo&wind_speed_unit=ms`;
        const res = await fetch(url);
        const data = await res.json();
        const cur = data.current;
        document.getElementById('temp-value').textContent = (Math.round(cur.temperature_2m * 10) / 10) + '°C';
        document.getElementById('wind-value').textContent =
          `${degToDir(cur.wind_direction_10m)} ${Math.round(cur.wind_speed_10m * 10) / 10}`;
      } catch (e) {
        document.getElementById('temp-value').textContent = '--°C';
        document.getElementById('wind-value').textContent = '取得失敗';
      }
    }

    async function fetchMarineAndDraw() {
      const container = document.getElementById('eq-container');
      const status = document.getElementById('status');
      status.textContent = '海洋データ取得中...';

      try {
        // 潮位 + 海水温を同時取得
        const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&hourly=sea_level_height_msl,sea_surface_temperature&timezone=Asia%2FTokyo&past_hours=12&forecast_hours=12`;
        const res = await fetch(url);
        const data = await res.json();

        const times = data.hourly.time;
        const levels = data.hourly.sea_level_height_msl;
        const ssts = data.hourly.sea_surface_temperature;

        // 海水温：現在に最も近い値を表示
        const now = new Date();
        let nearestSst = null;
        let minDiff = Infinity;
        for (let i = 0; i < times.length; i++) {
          if (ssts[i] == null) continue;
          const t = new Date(times[i]);
          const diff = Math.abs(t - now);
          if (diff < minDiff) {
            minDiff = diff;
            nearestSst = ssts[i];
          }
        }
        if (nearestSst != null) {
          document.getElementById('sst-value').textContent = (Math.round(nearestSst * 10) / 10) + '°C';
        } else {
          document.getElementById('sst-value').textContent = '--°C';
        }

        // 潮位バー生成
        const points = [];
        for (let i = 0; i < times.length; i++) {
          if (levels[i] != null) {
            points.push({ time: times[i], level: levels[i] });
          }
        }

        if (points.length === 0) throw new Error('潮位データなし');

        const minL = Math.min(...points.map(p => p.level));
        const maxL = Math.max(...points.map(p => p.level));
        const range = Math.max(maxL - minL, 0.25);
        const maxHeight = 200;

        container.innerHTML = '';

        points.forEach(p => {
          const bar = document.createElement('div');
          bar.className = 'eq-bar';
          const normalized = (p.level - minL) / range;
          bar.style.height = Math.max(8, normalized * maxHeight) + 'px';

          const t = new Date(p.time);
          if (Math.abs(t - now) < 35 * 60 * 1000) {
            bar.classList.add('current');
          }
          container.appendChild(bar);
        });

        status.textContent = `海面水位（近似） ${points.length}本　現在付近を赤表示`;
      } catch (e) {
        console.error(e);
        status.textContent = '海洋データの取得に失敗しました';
        document.getElementById('sst-value').textContent = '--°C';
        container.innerHTML = '<div style="color:#7a92b5;padding:40px;text-align:center;width:100%">データ取得失敗</div>';
      }
    }

    async function reloadData() {
      const btn = document.getElementById('reload-btn');
      btn.classList.add('spinning');
      updateDateTime();
      await Promise.all([fetchWeather(), fetchMarineAndDraw()]);
      setTimeout(() => btn.classList.remove('spinning'), 800);
    }

    // 初期化
    updateDateTime();
    reloadData();

    document.getElementById('reload-btn').addEventListener('click', reloadData);
    setInterval(updateDateTime, 60000);
  </script>
</body>
</html>
