<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>タイドグラフ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a1628;
      color: #e0eaf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .phone {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: linear-gradient(180deg, #0b1a2e 0%, #0a1525 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ステータスバー風 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 4px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 13px;
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-btn {
      font-size: 22px;
      color: #8ba3c7;
      cursor: pointer;
    }
    .location {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .location span {
      font-size: 14px;
      color: #7a92b5;
      margin-left: 2px;
    }
    .date {
      font-size: 13px;
      color: #7a92b5;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      gap: 16px;
      color: #8ba3c7;
      font-size: 20px;
    }

    /* グラフカード */
    .graph-card {
      margin: 0 12px;
      background: rgba(15, 30, 55, 0.7);
      border-radius: 16px;
      padding: 14px 12px 10px;
      border: 1px solid rgba(60, 90, 140, 0.3);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .graph-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #a8c4e8;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .graph-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 320px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 下部バー */
    .bottom-bar {
      margin: 12px;
      background: rgba(15, 30, 55, 0.85);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(60, 90, 140, 0.25);
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-icon {
      font-size: 18px;
      opacity: 0.9;
    }

    .info-text {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 11px;
      color: #7a92b5;
    }

    .info-value {
      font-size: 16px;
      font-weight: 700;
      color: #e8f0fa;
    }

    .divider {
      width: 1px;
      height: 28px;
      background: rgba(100, 130, 180, 0.3);
    }

    /* マーカー用のテキストスタイル */
    .tide-label {
      font-size: 11px;
      fill: #c5d8f0;
      font-weight: 500;
    }
    .tide-time {
      font-size: 12px;
      fill: #fff;
      font-weight: 700;
    }
    .current-label {
      font-size: 11px;
      fill: #ff6b6b;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- ステータスバー -->
    <div class="status-bar">
      <div>9:41</div>
      <div class="status-icons">
        <span>●●●</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <!-- ヘッダー -->
    <div class="header">
      <div class="header-left">
        <div class="menu-btn">☰</div>
        <div>
          <div class="location">東京 <span>▼</span></div>
          <div class="date">2026年10月20日（火）</div>
        </div>
      </div>
      <div class="header-right">
        <span>☆</span>
        <span>📅</span>
      </div>
    </div>

    <!-- タイドグラフ本体 -->
    <div class="graph-card">
      <div class="graph-title">
        <span>🌊</span> タイドグラフ
      </div>

      <div class="graph-container">
        <svg viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">
          <!-- 背景グラデーション（マズメ帯） -->
          <defs>
            <linearGradient id="mazume" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a5a8a" stop-opacity="0.15"/>
              <stop offset="40%" stop-color="#c9a227" stop-opacity="0.25"/>
              <stop offset="60%" stop-color="#c9a227" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#3a5a8a" stop-opacity="0.15"/>
            </linearGradient>
            <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.15"/>
            </linearGradient>
          </defs>

          <!-- マズメ帯（朝・夕） -->
          <rect x="70" y="40" width="80" height="240" fill="url(#mazume)"/>
          <rect x="250" y="40" width="80" height="240" fill="url(#mazume)"/>

          <!-- グリッド線 -->
          <g stroke="#2a4060" stroke-width="1" stroke-dasharray="3,4">
            <line x1="40" y1="60" x2="380" y2="60"/>
            <line x1="40" y1="110" x2="380" y2="110"/>
            <line x1="40" y1="160" x2="380" y2="160"/>
            <line x1="40" y1="210" x2="380" y2="210"/>
            <line x1="40" y1="260" x2="380" y2="260"/>
          </g>

          <!-- Y軸ラベル -->
          <g fill="#6b85a8" font-size="11" text-anchor="end">
            <text x="36" y="64">250</text>
            <text x="36" y="114">200</text>
            <text x="36" y="164">150</text>
            <text x="36" y="214">100</text>
            <text x="36" y="264">50</text>
            <text x="36" y="304">0</text>
          </g>
          <text x="20" y="30" fill="#6b85a8" font-size="11">cm</text>

          <!-- 潮位曲線（パス） -->
          <path d="M 40 280 
                   C 60 270, 80 200, 100 160
                   S 130 95, 155 95
                   S 180 140, 200 180
                   S 230 250, 250 255
                   S 280 200, 300 140
                   S 330 95, 350 100
                   S 370 160, 380 210"
                fill="url(#waveFill)"
                stroke="#60a5fa"
                stroke-width="2.5"
                stroke-linecap="round"/>

          <!-- 現在時刻の赤い縦線 -->
          <line x1="175" y1="40" x2="175" y2="290" 
                stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
          
          <!-- 現在ラベル -->
          <rect x="145" y="118" width="60" height="20" rx="4" fill="#ef4444"/>
          <text x="175" y="132" text-anchor="middle" class="current-label" fill="#fff">現在 9:41</text>
          <polygon points="175,140 170,148 180,148" fill="#ef4444"/>

          <!-- 満潮マーカー 1 -->
          <polygon points="155,88 150,98 160,98" fill="#60a5fa"/>
          <text x="155" y="78" text-anchor="middle" class="tide-label">満潮</text>
          <text x="155" y="68" text-anchor="middle" class="tide-time">04:32</text>

          <!-- 満潮マーカー 2 -->
          <polygon points="340,93 335,103 345,103" fill="#60a5fa"/>
          <text x="340" y="83" text-anchor="middle" class="tide-label">満潮</text>
          <text x="340" y="73" text-anchor="middle" class="tide-time">16:48</text>

          <!-- 干潮マーカー 1 -->
          <polygon points="250,262 245,252 255,252" fill="#94a3b8"/>
          <text x="250" y="278" text-anchor="middle" class="tide-label">干潮</text>
          <text x="250" y="292" text-anchor="middle" class="tide-time">10:15</text>

          <!-- 干潮マーカー 2 -->
          <polygon points="380,218 375,208 385,208" fill="#94a3b8"/>
          <text x="365" y="240" text-anchor="middle" class="tide-label">干潮</text>
          <text x="365" y="254" text-anchor="middle" class="tide-time">22:40</text>

          <!-- X軸時間 -->
          <g fill="#6b85a8" font-size="12" text-anchor="middle">
            <text x="40" y="320">0</text>
            <text x="95" y="320">3</text>
            <text x="150" y="320">6</text>
            <text x="205" y="320">9</text>
            <text x="260" y="320">12</text>
            <text x="315" y="320">15</text>
            <text x="355" y="320">18</text>
            <text x="385" y="320">24</text>
          </g>
        </svg>
      </div>
    </div>

    <!-- 下部：気温・風 -->
    <div class="bottom-bar">
      <div class="info-item">
        <div class="info-icon">🌡️</div>
        <div class="info-text">
          <div class="info-label">気温</div>
          <div class="info-value">22°C</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="info-item">
        <div class="info-icon">↗️</div>
        <div class="info-text">
          <div class="info-label">風向・風速</div>
          <div class="info-value">3.2 m/s</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
