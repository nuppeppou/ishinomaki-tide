<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>石巻 タイドグラフ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1628;
      color: #e0eaf5;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 4px;
    }
    .location {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .date {
      font-size: 13px;
      color: #7a92b5;
    }
    .graph-card {
      background: rgba(15, 30, 55, 0.75);
      border-radius: 16px;
      padding: 14px 10px 8px;
      border: 1px solid rgba(60, 90, 140, 0.3);
    }
    .graph-title {
      font-size: 14px;
      color: #a8c4e8;
      margin-bottom: 6px;
      padding-left: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .graph-container {
      width: 100%;
      height: 340px;
    }
    svg { width: 100%; height: 100%; display: block; }
    .bottom-bar {
      background: rgba(15, 30, 55, 0.85);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid rgba(60, 90, 140, 0.25);
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-label { font-size: 11px; color: #7a92b5; }
    .info-value { font-size: 17px; font-weight: 700; color: #e8f0fa; }
    .divider {
      width: 1px;
      height: 30px;
      background: rgba(100, 130, 180, 0.3);
    }
    .note {
      font-size: 11px;
      color: #5a7399;
      text-align: center;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <div class="header">
      <div>
        <div class="location">石巻</div>
        <div class="date">2026年10月20日（火）・長潮</div>
      </div>
      <div class="date" id="now-time"></div>
    </div>

    <!-- タイドグラフ -->
    <div class="graph-card">
      <div class="graph-title">🌊 タイドグラフ（石巻）</div>
      <div class="graph-container">
        <svg viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.1"/>
            </linearGradient>
            <linearGradient id="mazume" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c9a227" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#c9a227" stop-opacity="0.05"/>
            </linearGradient>
          </defs>

          <!-- マズメ帯（簡易） -->
          <rect x="55" y="40" width="55" height="240" fill="url(#mazume)"/>
          <rect x="290" y="40" width="55" height="240" fill="url(#mazume)"/>

          <!-- グリッド -->
          <g stroke="#2a4060" stroke-width="1" stroke-dasharray="3,4">
            <line x1="40" y1="60" x2="380" y2="60"/>
            <line x1="40" y1="110" x2="380" y2="110"/>
            <line x1="40" y1="160" x2="380" y2="160"/>
            <line x1="40" y1="210" x2="380" y2="210"/>
            <line x1="40" y1="260" x2="380" y2="260"/>
          </g>

          <!-- Y軸 -->
          <g fill="#6b85a8" font-size="11" text-anchor="end">
            <text x="36" y="64">150</text>
            <text x="36" y="114">120</text>
            <text x="36" y="164">90</text>
            <text x="36" y="214">60</text>
            <text x="36" y="264">30</text>
            <text x="36" y="304">0</text>
          </g>
          <text x="18" y="30" fill="#6b85a8" font-size="11">cm</text>

          <!-- 潮位曲線（今日の予測に基づく近似） -->
          <!-- 4:31 54cm → 13:16 119cm → 18:19 106cm → 21:27 109cm -->
          <path d="M 40 255
                   C 70 250, 90 240, 110 230
                   S 140 180, 170 130
                   S 200 95, 230 95
                   S 260 110, 280 130
                   S 300 145, 320 148
                   S 340 145, 360 142
                   S 375 140, 380 140"
                fill="url(#waveFill)"
                stroke="#60a5fa"
                stroke-width="2.5"
                stroke-linecap="round"/>

          <!-- 現在時刻ライン（13:40頃） -->
          <line x1="235" y1="40" x2="235" y2="290"
                stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
          <rect x="205" y="115" width="60" height="20" rx="4" fill="#ef4444"/>
          <text x="235" y="129" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">現在</text>
          <polygon points="235,137 230,145 240,145" fill="#ef4444"/>

          <!-- 満潮 13:16 119cm -->
          <polygon points="225,88 220,98 230,98" fill="#60a5fa"/>
          <text x="225" y="78" text-anchor="middle" fill="#c5d8f0" font-size="11">満潮</text>
          <text x="225" y="66" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">13:16</text>

          <!-- 満潮 21:27 109cm -->
          <polygon points="365,135 360,145 370,145" fill="#60a5fa"/>
          <text x="350" y="125" text-anchor="middle" fill="#c5d8f0" font-size="11">満潮</text>
          <text x="350" y="113" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">21:27</text>

          <!-- 干潮 4:31 54cm -->
          <polygon points="75,252 70,242 80,242" fill="#94a3b8"/>
          <text x="75" y="270" text-anchor="middle" fill="#c5d8f0" font-size="11">干潮</text>
          <text x="75" y="284" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">04:31</text>

          <!-- 干潮 18:19 106cm -->
          <polygon points="310,155 305,145 315,145" fill="#94a3b8"/>
          <text x="310" y="175" text-anchor="middle" fill="#c5d8f0" font-size="11">干潮</text>
          <text x="310" y="189" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">18:19</text>

          <!-- X軸 -->
          <g fill="#6b85a8" font-size="12" text-anchor="middle">
            <text x="40" y="320">0</text>
            <text x="95" y="320">3</text>
            <text x="150" y="320">6</text>
            <text x="205" y="320">9</text>
            <text x="260" y="320">12</text>
            <text x="315" y="320">15</text>
            <text x="360" y="320">18</text>
            <text x="390" y="320">24</text>
          </g>
        </svg>
      </div>
    </div>

    <!-- 下部：気温・風（小さく） -->
    <div class="bottom-bar">
      <div class="info-item">
        <div style="font-size:18px">🌡️</div>
        <div>
          <div class="info-label">気温</div>
          <div class="info-value">18°C</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div style="font-size:18px">↗️</div>
        <div>
          <div class="info-label">風向・風速</div>
          <div class="info-value">北北東 2 m/s</div>
        </div>
      </div>
    </div>

    <div class="note">
      潮位：気象庁予測（石巻）　気温・風：アメダス石巻付近の実況目安<br>
      ※実測潮位は気象条件により異なる場合があります
    </div>
  </div>

  <script>
    // 現在時刻を表示
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('now-time').textContent = h + ':' + m;
    }
    updateTime();
    setInterval(updateTime, 30000);
  </script>
</body>
</html>
