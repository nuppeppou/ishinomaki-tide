<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a192f">
  <title>石巻市 リアルタイム潮位グラフ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(160deg, #0a192f 0%, #112240 100%);
      color: #e6f1ff;
      line-height: 1.5;
      overscroll-behavior: none;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      text-align: center;
      padding: 12px 0 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #8892b0;
      margin-top: 4px;
    }

    .card {
      background: rgba(17, 34, 64, 0.85);
      border: 1px solid #233554;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .realtime-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #64ffda;
      color: #0a192f;
      font-weight: 700;
      font-size: 1.15rem;
      text-align: center;
      padding: 18px 16px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
      min-height: 56px;
      transition: transform 0.15s, opacity 0.15s;
    }

    .realtime-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .note {
      font-size: 0.82rem;
      color: #8892b0;
      text-align: center;
      line-height: 1.5;
    }

    .chart-wrapper {
      position: relative;
      height: 280px;
      width: 100%;
    }

    @media (min-height: 700px) {
      .chart-wrapper { height: 320px; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .chart-wrapper { height: 220px; }
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .info-item {
      background: #112240;
      padding: 12px 8px;
      border-radius: 12px;
      text-align: center;
    }

    .info-item span {
      display: block;
      font-size: 0.78rem;
      color: #8892b0;
      margin-bottom: 2px;
    }

    .info-item strong {
      font-size: 1.25rem;
      color: #64ffda;
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.5;
      padding-bottom: 10px;
    }

    @media (max-width: 360px) {
      h1 { font-size: 1.3rem; }
      .realtime-btn { font-size: 1.05rem; padding: 16px 12px; }
      .info-item strong { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>石巻市 潮位グラフ</h1>
      <p class="subtitle">石巻港（NOWPHAS観測点）</p>
    </header>

    <div class="card">
      <a class="realtime-btn" href="https://nowphas.mlit.go.jp/sp/pg_choui/218/" target="_blank" rel="noopener">
        ▶ リアルタイム実測潮位を見る
      </a>
      <p class="note">
        国土交通省ナウファス公式ページが開きます。<br>
        1分ごとの実測潮位・偏差が確認できます。
      </p>
    </div>

    <div class="card">
      <h2 style="font-size:1.05rem; margin-bottom:12px; text-align:center;">本日の予測潮位（参考）</h2>
      <div class="chart-wrapper">
        <canvas id="tideChart"></canvas>
      </div>

      <div class="info">
        <div class="info-item">
          <span>現在時刻（JST）</span>
          <strong id="nowTime">--:--</strong>
        </div>
        <div class="info-item">
          <span>最終更新</span>
          <strong id="updateTime">--</strong>
        </div>
      </div>

      <p class="note" style="margin-top:14px;">
        ※グラフは予測値です。実際の潮位は気象条件で変動します。<br>
        正確な実測値は上の公式ページをご確認ください。
      </p>
    </div>

    <footer>
      データ出典：国土交通省ナウファス / 気象庁潮位表<br>
      このページは参考用です。航海・防災目的には公式情報を使用してください。
    </footer>
  </div>

  <script>
    function generateTideData() {
      const labels = [];
      const data = [];
      const base = 80;
      const amp1 = 48;
      const amp2 = 14;

      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 30) {
          const hour = h + m / 60;
          labels.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
          const tide = base
            + amp1 * Math.sin(2 * Math.PI * (hour - 3.2) / 12.42)
            + amp2 * Math.sin(4 * Math.PI * (hour - 1.5) / 12.42);
          data.push(Math.round(tide));
        }
      }
      return { labels, data };
    }

    const { labels, data } = generateTideData();

    const ctx = document.getElementById('tideChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '予測潮位 (cm)',
          data: data,
          borderColor: '#64ffda',
          backgroundColor: 'rgba(100, 255, 218, 0.12)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(10,25,47,0.9)',
            titleColor: '#64ffda',
            bodyColor: '#e6f1ff',
            padding: 10,
            callbacks: {
              label: (ctx) => `潮位: ${ctx.parsed.y} cm`
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: '#8892b0',
              maxTicksLimit: 8,
              font: { size: 11 }
            },
            grid: { color: 'rgba(136,146,176,0.08)' }
          },
          y: {
            ticks: {
              color: '#8892b0',
              font: { size: 11 }
            },
            grid: { color: 'rgba(136,146,176,0.08)' },
            title: {
              display: true,
              text: '潮位 (cm)',
              color: '#8892b0',
              font: { size: 12 }
            }
          }
        },
        interaction: {
          intersect: false,
          mode: 'index'
        }
      }
    });

    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      const dateOptions = { timeZone: 'Asia/Tokyo', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      
      document.getElementById('nowTime').textContent = now.toLocaleTimeString('ja-JP', options);
      document.getElementById('updateTime').textContent = now.toLocaleString('ja-JP', dateOptions);
    }
    updateClock();
    setInterval(updateClock, 1000);

    setTimeout(() => location.reload(), 30 * 60 * 1000);
  </script>
</body>
</html>
